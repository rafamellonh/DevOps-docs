######### kubectl delete -f monitoring.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

---
# =========================================================
# PROMETHEUS SERVICE ACCOUNT
# =========================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring

---
# =========================================================
# PROMETHEUS CLUSTER ROLE
# Permite descobrir Nodes, Pods, Services etc.
# =========================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs:
      - get
      - list
      - watch

---
# =========================================================
# PROMETHEUS CLUSTER ROLE BINDING
# =========================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring

---
# =========================================================
# NODE EXPORTER
#
# DaemonSet:
# cria 1 Pod node-exporter em cada Node.
#
# Porta:
# 9100
# =========================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-exporter

  template:
    metadata:
      labels:
        app: node-exporter

    spec:
      hostNetwork: true
      hostPID: true

      # Permite rodar também em Nodes com taints,
      # como Control Plane em ambientes de laboratório.
      tolerations:
        - operator: Exists

      containers:
        - name: node-exporter
          image: prom/node-exporter:latest

          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)

          ports:
            - name: metrics
              containerPort: 9100
              hostPort: 9100

          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true

            - name: sys
              mountPath: /host/sys
              readOnly: true

            - name: root
              mountPath: /host/root
              readOnly: true

      volumes:
        - name: proc
          hostPath:
            path: /proc

        - name: sys
          hostPath:
            path: /sys

        - name: root
          hostPath:
            path: /

---
# =========================================================
# PROMETHEUS CONFIG
# =========================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      # -----------------------------------------------------
      # Prometheus monitora ele mesmo
      # -----------------------------------------------------
      - job_name: prometheus

        static_configs:
          - targets:
              - localhost:9090

      # -----------------------------------------------------
      # Descoberta automática dos Kubernetes Nodes
      #
      # Prometheus pega o InternalIP de cada Node
      # e conecta na porta 9100 do node-exporter.
      # -----------------------------------------------------
      - job_name: kubernetes-nodes

        kubernetes_sd_configs:
          - role: node

        relabel_configs:

          # Internal IP do Kubernetes Node
          - source_labels:
              - __meta_kubernetes_node_address_InternalIP
            regex: (.+)
            target_label: __address__
            replacement: $1:9100

          # Nome do Kubernetes Node
          - source_labels:
              - __meta_kubernetes_node_name
            target_label: kubernetes_node

          # Copia labels do Kubernetes para métricas
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

---
# =========================================================
# PROMETHEUS PVC
#
# Precisa existir um StorageClass default no cluster.
# =========================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 5Gi

---
# =========================================================
# PROMETHEUS DEPLOYMENT
# =========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      serviceAccountName: prometheus

      securityContext:
        fsGroup: 65534

      containers:
        - name: prometheus
          image: prom/prometheus:latest

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d

          ports:
            - name: http
              containerPort: 9090

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus

            - name: data
              mountPath: /prometheus

      volumes:
        - name: config
          configMap:
            name: prometheus-config

        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data

---
# =========================================================
# PROMETHEUS SERVICE
#
# Fica somente dentro do Kubernetes.
#
# Grafana acessa:
# http://prometheus.monitoring.svc.cluster.local:9090
# =========================================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus

  ports:
    - name: http
      port: 9090
      targetPort: 9090

  type: ClusterIP

---
# =========================================================
# GRAFANA SECRET
#
# LAB:
# usuário: admin
# senha: admin123
#
# Troque a senha para ambientes reais.
# =========================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: admin123

---
# =========================================================
# GRAFANA DATASOURCE
#
# Configura Prometheus automaticamente no Grafana.
# =========================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  prometheus.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy

        url: http://prometheus.monitoring.svc.cluster.local:9090

        isDefault: true
        editable: true

---
# =========================================================
# GRAFANA PVC
# =========================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 2Gi

---
# =========================================================
# GRAFANA DEPLOYMENT
# =========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      securityContext:
        fsGroup: 472

      containers:
        - name: grafana
          image: grafana/grafana:latest

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-user

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-password

          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources

            - name: data
              mountPath: /var/lib/grafana

      volumes:
        - name: datasource
          configMap:
            name: grafana-datasources

        - name: data
          persistentVolumeClaim:
            claimName: grafana-data

---
# =========================================================
# GRAFANA SERVICE
#
# NODEPORT
#
# Permite acessar:
#
# http://IP-DO-NODE:32000
#
# Não precisa usar kubectl port-forward.
# =========================================================
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana

  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 32000

  type: NodePort