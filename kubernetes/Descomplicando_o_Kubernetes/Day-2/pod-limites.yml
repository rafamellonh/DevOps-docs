apiVersion: v1
kind: Pod 
metadata:
  labels:
    run: pod-limites
  name: pod-limites
spec:
  containers:
  - name: pod-limites
    image: ubuntu
    args:
    - sleep
    - "600"
    resources:
      limits:
        cpu: "0.5"
        memory: 100Mi        
      requests:
        cpu: "0.3"
        memory: 100Mi
  dnsPolicy: ClusterFirst
  restartPolicy: Always