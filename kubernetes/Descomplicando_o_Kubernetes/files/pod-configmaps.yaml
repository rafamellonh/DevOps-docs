apiVersion: v1
kind: Pod
metadata:
  name: pod-configmaps
  labels:
    app: nginx
spec:
  containers:
  - name: pod-secret
    image: nginx
    ports:
      - containerPort: 80
      - containerPort: 443
    volumeMounts:
      - name: nginx-config-volume
        mountPath: /etc/nginx/nginx.conf
        subPath: nginx.conf
      - name: nginx-tls
        mountPath: /etc/nginx/tls
  volumes:
    - name: nginx-config-volume
      configMap:
        name: nginx-config
    - name: nginx-tls
      secret:
        secretName: secret-tls
        items:
          - key: tls.crt 
            path: certificado-secret.crt
          - key: tls.key
            path: chave-privada-secret.key

