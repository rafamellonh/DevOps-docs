apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: web
  name: webserver

spec:
  replicas: 6
  selector:
    matchLabels:
      app: web 

  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      -  name: webserver
         image: nginx
         ports:
         -  containerPort: 80
            name: http
         resources:
          requests:
            cpu: 100m
            memory: "128Mi"
          limits:
            cpu: 100m
            memory: "245Mi"
         startupProbe:
           tcpSocket:
             port: 80
           periodSeconds: 10
           timeoutSeconds: 5
           failureThreshold: 5
         livenessProbe:
           tcpSocket:
             port: 80 
           periodSeconds: 10
           timeoutSeconds: 5 
           failureThreshold: 5
         readinessProbe:
           httpGet:
            path: /
            port: 80 
           periodSeconds: 10
           timeoutSeconds: 5
           failureThreshold: 3

      - name: node
        image: prom/node-exporter
        ports:
        - containerPort: 9100
          name: metrics
        resources:
          requests:
            cpu: 100m
            memory: "128Mi"
          limits:
            cpu: 100m
            memory: "245Mi"
        startupProbe:
          tcpSocket:
            port: 9100
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          tcpSocket:
            port: 9100
          periodSeconds: 10
          timeoutSeconds: 5 
          failureThreshold: 5
        readinessProbe:
          httpGet:
           path: /metrics
           port: 9100 
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3







