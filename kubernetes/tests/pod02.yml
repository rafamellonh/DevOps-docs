apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: web
  name: webserver

spec:
  replicas: 6
  selector:
    matchLabels:
      app: web 

  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      -  name: webserver
         image: nginx
         ports:
         -  containerPort: 80
         resources:
          requests:
            cpu: 100m
            memory: "128Mi"
          limits:
            cpu: 100m
            memory: "245Mi"

      - name: node
        image: prom/node-exporter
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: "128Mi"
          limits:
            cpu: 100m
            memory: "245Mi"
