apiVersion: apps/v1
kind: Pod
metadata:
  labels:
    app: web
  name: webserver

spec:
  replicas: 6
  selector:
    matchLabels:
      app: web 

  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      -  name: pod-webserver
         image: nginx
      ports:
        containerPort: 80
      
        resources:
         requests:
           cpu: 0.5
           memory: "128Mi"
        limits:
          cpu: 1
          memory: "245Mi"
