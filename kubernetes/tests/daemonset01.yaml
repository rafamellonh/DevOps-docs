apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: node-daemonset
  name: node-daemonset

spec:
  selector:
    matchLabels:
      app: node-daemonset

  template:
    metadata:
      labels:
        app: node-daemonset
    spec:
      containers:
      - name: node
        image: prom/node-exporter
        ports:
          - containerPort: 9100
            name: metrics
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "254Mi"

        startupProbe:
          tcpSocket:
            port: 9100
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        
        livenessProbe:
          tcpSocket:
            port: 9100
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5

        readinessProbe:
          httpGet:
            path: /metrics
            port: 9100
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3



        

          

            
    

