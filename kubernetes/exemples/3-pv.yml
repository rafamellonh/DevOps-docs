# ATENÇÃO: antes de aplicar, criar os diretórios no nó worker:
#   sudo mkdir -p /mnt/data-02 /mnt/data-03 /mnt/data-04
# hostPath não cria a pasta de forma confiável para escrita — sem isso os pods podem falhar com erro de permissão.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sc-02
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---

apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    type: local
  name: pv-02
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data-02
  storageClassName: sc-02
---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    type: local
  name: pv-03
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data-03
  storageClassName: sc-02
---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    type: local
  name: pv-04
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data-04
  storageClassName: sc-02


---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-02
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: sc-02
  selector:
    matchLabels:
      type: local
