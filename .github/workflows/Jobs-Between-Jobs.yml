name: Jobs Between Jobs

on:
  push:
    branches:
      - main

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Check Ubuntu Version
        run: cat /etc/os-release

      - name: Show message
        run: echo "Hello - I am Rafael" > ${{ github.workspace }}/message.txt

      
      - uses: actions/upload-artifact@v4
        with:
          name: Mello-upload
          path: ${{ github.workspace }}/message.txt
  
  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: check content folder
        run: ls -lha 

      - uses: actions/download-artifact@v4
        with:
          name: Mello-upload
          path: .
      
      - name: Access the message file
        run: cat message.txt 

      - name: Delete message file
        run: rm message.txt && ls -lha